<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Eniv - Emploi du temps</title>
  <link rel="icon" type="image/x-icon" href="/images/logo.ico">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#4a90e2">
  <script src="/js/pwa.js" defer></script>
  <!-- Doit rester synchrone et avant les styles : applique le thème avant le premier rendu -->
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/emploi-temps.css">
  <link rel="stylesheet" href="/css/loading.css">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo">Eniv</div>
    <div class="loading-spinner-bar"></div>
  </div>

  <!-- Rempli par /js/components/header.js -->
  <header id="app-header"></header>

  <main class="container edt">
    <div class="edt-barre">
      <div class="edt-titre">
        <h2>Emploi du temps</h2>
        <p id="edt-maj" class="edt-maj"></p>
      </div>
      <nav id="edt-nav" class="edt-nav hidden" aria-label="Semaines">
        <button type="button" id="edt-precedente" class="edt-fleche" aria-label="Semaine précédente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span id="edt-semaine" class="edt-semaine" aria-live="polite"></span>
        <button type="button" id="edt-suivante" class="edt-fleche" aria-label="Semaine suivante">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <button type="button" id="edt-aujourdhui" class="edt-aujourdhui">Aujourd'hui</button>
      </nav>
    </div>

    <p id="edt-bandeau" class="edt-bandeau hidden" role="status"></p>

    <!-- Chargeur affiché jusqu'à la réponse : la source peut mettre du temps à répondre -->
    <div id="edt-contenu" class="edt-contenu">
      <div class="edt-etat" role="status">
        <span class="edt-chargement" aria-hidden="true"></span>
        <p>Chargement de l'emploi du temps…</p>
      </div>
    </div>
  </main>

  <div id="cours-modal" class="modal">
    <div class="modal-content edt-modal" role="dialog" aria-modal="true" aria-labelledby="cours-modal-titre">
      <div class="modal-header">
        <h2 id="cours-modal-titre"></h2>
        <button type="button" class="modal-close" id="cours-modal-close" aria-label="Fermer">&times;</button>
      </div>
      <div id="cours-modal-corps"></div>
    </div>
  </div>

  <script type="module" src="/js/pages/emploiTemps.js"></script>
</body>
</html>
