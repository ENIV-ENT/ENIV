<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Eniv - Emploi du temps</title>
  <link rel="icon" type="image/x-icon" href="/images/logo.ico">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#4a90e2">
  <script src="/js/pwa.js" defer></script>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/timetable.css">
  <link rel="stylesheet" href="/css/loading.css">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo">Eniv</div>
    <div class="loading-spinner-bar"></div>
  </div>

  <header id="app-header"></header>

  <main class="container timetable">
    <div class="timetable-bar">
      <div class="timetable-title">
        <h2>Emploi du temps</h2>
        <p id="timetable-updated" class="timetable-updated"></p>
      </div>
      <nav id="timetable-nav" class="timetable-nav hidden" aria-label="Semaines">
        <button type="button" id="timetable-previous" class="timetable-arrow" aria-label="Semaine précédente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span id="timetable-week" class="timetable-week" aria-live="polite"></span>
        <button type="button" id="timetable-next" class="timetable-arrow" aria-label="Semaine suivante">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <button type="button" id="timetable-today" class="timetable-today">Aujourd'hui</button>
      </nav>
    </div>

    <p id="timetable-banner" class="timetable-banner hidden" role="status"></p>

    <div id="timetable-content" class="timetable-content">
      <div class="timetable-state" role="status">
        <span class="timetable-spinner" aria-hidden="true"></span>
        <p>Chargement de l'emploi du temps…</p>
      </div>
    </div>
  </main>

  <div id="lesson-modal" class="modal">
    <div class="modal-content timetable-modal" role="dialog" aria-modal="true" aria-labelledby="lesson-modal-title">
      <div class="modal-header">
        <h2 id="lesson-modal-title"></h2>
        <button type="button" class="modal-close" id="lesson-modal-close" aria-label="Fermer">&times;</button>
      </div>
      <div id="lesson-modal-body"></div>
    </div>
  </div>

  <script type="module" src="/js/pages/timetable.js"></script>
</body>
</html>
