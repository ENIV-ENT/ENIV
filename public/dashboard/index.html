<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eniv - Mes Devoirs</title>
  <link rel="icon" type="image/x-icon" href="/images/logo.ico">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/loading.css">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo">Eniv</div>
    <div class="loading-spinner-bar"></div>
  </div>

  <header>
    <h1><a href="/dashboard" style="color: inherit; text-decoration: none; cursor: pointer;">Eniv</a></h1>
    <div class="header-actions">
      <div class="user-menu">
        <button id="user-menu-btn" class="user-menu-btn">
          <span id="eleve-info"></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 0.5rem;">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div id="user-dropdown" class="user-dropdown hidden">
          <button id="admin-btn" class="dropdown-item hidden">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1l3 5 5 1-3.5 4 1 5-5.5-2.5L6 17l1-5L3.5 7l5-1z"></path>
            </svg>
            Admin
            <span id="admin-pending-badge" class="dropdown-badge hidden">0</span>
          </button>
          <button id="emploi-temps-btn" class="dropdown-item hidden">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Emploi du temps
          </button>
          <button id="settings-btn" class="dropdown-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Paramètres
          </button>
          <button id="logout-btn" class="dropdown-item logout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Déconnexion
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Message d'attente pour les utilisateurs en pending -->
  <div id="pending-banner" class="pending-banner" style="display: none;">
    <p>Votre demande d'adhésion est en attente d'approbation par l'administrateur de la classe <strong id="pending-classe-name"></strong>.</p>
  </div>

  <!-- Calendrier -->
  <div id="main-content" class="container">
    <div class="calendar-header">
      <button id="prev-month" class="btn-secondary">&lt;</button>
      <h2 id="current-month"></h2>
      <button id="next-month" class="btn-secondary">&gt;</button>
    </div>

    <div id="calendar" class="calendar"></div>
  </div>

  <!-- Modals pour les devoirs (gardés identiques) -->
  <div id="devoir-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Détails du devoir</h2>
        <button class="modal-close" id="close-modal">&times;</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="add-devoir-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Ajouter un devoir</h2>
        <button class="modal-close" id="close-add-modal">&times;</button>
      </div>
      <form id="devoir-form">
        <div class="form-group">
          <label for="devoir-titre" class="form-label">Titre du devoir</label>
          <input type="text" id="devoir-titre" placeholder="Ex: Exercices de mathématiques" required>
        </div>
        <div class="form-group">
          <label for="devoir-matiere" class="form-label">Matière</label>
          <select id="devoir-matiere" required>
            <option value="">Sélectionner une matière</option>
          </select>
        </div>
        <div class="form-group">
          <label for="devoir-description" class="form-label">Description (optionnel)</label>
          <textarea id="devoir-description" placeholder="Détails du devoir..." rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="devoir-date-limite" class="form-label">Pour le</label>
          <input type="date" id="devoir-date-limite" required>
        </div>
        <div class="form-group">
          <label class="form-label">Fichiers PDF (optionnel)</label>
          <div id="devoir-drop-zone" style="border: 2px dashed var(--border); border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.3s ease; background: var(--light); margin-bottom: 0.5rem;">
            <input type="file" id="devoir-fichiers" accept=".pdf,.docx,.doc,.pptx,.ppt,.xlsx,.xls" multiple style="display: none;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto; color: var(--primary);">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p style="margin: 0.5rem 0 0 0; color: var(--primary); font-weight: 500;">Cliquez ou glissez-déposez vos fichiers</p>
            <small style="color: var(--secondary); font-size: 0.85rem;">10 Mo max par fichier</small>
          </div>
          <div id="devoir-fichiers-list" style="margin-top: 0.5rem;"></div>
        </div>
        <div class="form-actions">
          <button type="submit" id="add-devoir-submit-btn" class="btn-primary">Créer le devoir</button>
          <button type="button" id="cancel-devoir-btn" class="btn-secondary">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <div id="edit-devoir-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Modifier le devoir</h2>
        <button class="modal-close" id="close-edit-devoir-modal">&times;</button>
      </div>
      <form id="edit-devoir-form">
        <input type="hidden" id="edit-devoir-id">
        <div class="form-group">
          <label for="edit-devoir-titre" class="form-label">Titre du devoir</label>
          <input type="text" id="edit-devoir-titre" required>
        </div>
        <div class="form-group">
          <label for="edit-devoir-matiere" class="form-label">Matière</label>
          <select id="edit-devoir-matiere" required>
            <option value="">Sélectionner une matière</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edit-devoir-description" class="form-label">Description (optionnel)</label>
          <textarea id="edit-devoir-description" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="edit-devoir-date-limite" class="form-label">Pour le</label>
          <input type="date" id="edit-devoir-date-limite" required>
        </div>
        <div id="edit-devoir-fichiers-existants" style="margin-bottom: 1rem;"></div>
        <div class="form-group">
          <label class="form-label">Ajouter des fichiers (optionnel)</label>
          <div id="edit-devoir-drop-zone" style="border: 2px dashed var(--border); border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; background: var(--light); margin-bottom: 0.5rem;">
            <input type="file" id="edit-devoir-nouveaux-fichiers" accept=".pdf,.docx,.doc,.pptx,.ppt,.xlsx,.xls" multiple style="display: none;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto; color: var(--primary);">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p style="margin: 0.5rem 0 0 0; color: var(--primary); font-weight: 500;">Cliquez ou glissez-déposez vos fichiers</p>
            <small style="color: var(--secondary); font-size: 0.85rem;">10 Mo max par fichier</small>
          </div>
          <div id="edit-devoir-nouveaux-fichiers-list" style="margin-top: 0.5rem;"></div>
        </div>
        <div class="form-actions">
          <button type="submit" id="edit-devoir-submit-btn" class="btn-primary">Enregistrer</button>
          <button type="button" id="cancel-edit-devoir-btn" class="btn-secondary">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
