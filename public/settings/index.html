<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eniv - Paramètres</title>
  <link rel="icon" type="image/x-icon" href="/images/logo.ico">
  <link rel="stylesheet" href="/css/settings.css">
</head>
<body>
  <header>
    <h1>Eniv</h1>
    <div class="header-actions">
      <button id="back-btn" class="btn-secondary">Retour</button>
      <span id="user-info"></span>
      <button id="logout-btn" class="btn-secondary">Déconnexion</button>
    </div>
  </header>

  <div class="container">
    <form id="info-form" class="form-container">
      <h2>Mes informations</h2>
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" placeholder="email@exemple.com" required>
      </div>
      <div class="form-group">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" id="nom" placeholder="Nom" required>
      </div>
      <div class="form-group">
        <label for="prenom" class="form-label">Prénom</label>
        <input type="text" id="prenom" placeholder="Prénom" required>
      </div>
      <button type="submit" class="btn-primary">Enregistrer mes informations</button>
    </form>

    <form id="password-form" class="form-container">
      <h2>Changer mon mot de passe</h2>
      <div class="form-group">
        <label for="old-password" class="form-label">Mot de passe actuel</label>
        <input type="password" id="old-password" placeholder="Mot de passe actuel" required>
      </div>
      <div class="form-group">
        <label for="new-password" class="form-label">Nouveau mot de passe</label>
        <input type="password" id="new-password" placeholder="Nouveau mot de passe" required>
      </div>
      <div class="form-group">
        <label for="confirm-password" class="form-label">Confirmer le nouveau mot de passe</label>
        <input type="password" id="confirm-password" placeholder="Confirmer le nouveau mot de passe" required>
      </div>
      <button type="submit" class="btn-primary">Modifier le mot de passe</button>
    </form>
  </div>

  <script type="module" src="/js/pages/settings.js"></script>
</body>
</html>
