<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eniv - Paramètres</title>
  <link rel="icon" type="image/x-icon" href="/images/logo.ico">
  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/loading.css">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo">Eniv</div>
    <div class="loading-spinner-bar"></div>
  </div>
  <header>
    <h1><a href="/dashboard" style="color: inherit; text-decoration: none; cursor: pointer;">Eniv</a></h1>
    <div class="header-actions">
      <div class="user-menu">
        <button id="user-menu-btn" class="user-menu-btn">
          <span id="user-info"></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 0.5rem;">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div id="user-dropdown" class="user-dropdown hidden">
          <button id="admin-btn" class="dropdown-item hidden">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1l3 5 5 1-3.5 4 1 5-5.5-2.5L6 17l1-5L3.5 7l5-1z"></path>
            </svg>
            Admin
          </button>
          <button id="emploi-temps-btn" class="dropdown-item hidden">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Emploi du temps
          </button>
          <button id="dashboard-btn" class="dropdown-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Tableau de bord
          </button>
          <button id="logout-btn" class="dropdown-item logout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Déconnexion
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <form id="info-form" class="form-container">
      <h2>Mes informations</h2>
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" placeholder="email@exemple.com" required>
      </div>
      <div class="form-group">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" id="nom" placeholder="Nom" required>
      </div>
      <div class="form-group">
        <label for="prenom" class="form-label">Prénom</label>
        <input type="text" id="prenom" placeholder="Prénom" required>
      </div>
      <button type="submit" class="btn-primary">Enregistrer mes informations</button>
    </form>

    <form id="password-form" class="form-container">
      <h2>Changer mon mot de passe</h2>
      <div class="form-group">
        <label for="old-password" class="form-label">Mot de passe actuel</label>
        <input type="password" id="old-password" placeholder="Mot de passe actuel" required>
      </div>
      <div class="form-group">
        <label for="new-password" class="form-label">Nouveau mot de passe</label>
        <input type="password" id="new-password" placeholder="Nouveau mot de passe" required>
      </div>
      <div class="form-group">
        <label for="confirm-password" class="form-label">Confirmer le nouveau mot de passe</label>
        <input type="password" id="confirm-password" placeholder="Confirmer le nouveau mot de passe" required>
      </div>
      <button type="submit" class="btn-primary">Modifier le mot de passe</button>
    </form>
  </div>

  <script type="module" src="/js/pages/settings.js"></script>
</body>
</html>
