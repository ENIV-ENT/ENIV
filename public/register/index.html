<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eniv - Inscription</title>
  <link rel="icon" type="image/x-icon" href="/images/logo.ico">
  <link rel="stylesheet" href="/css/register.css">
</head>
<body>
  <header>
    <h1>Eniv</h1>
  </header>

  <div class="register-container">
    <div id="loading-state" class="form-container" style="text-align: center;">
      <div class="loading-spinner" style="width: 40px; height: 40px; border-width: 4px;"></div>
      <p>Vérification de votre invitation...</p>
    </div>

    <div id="error-state" style="display: none;">
      <div class="error-container">
        <h2>Invitation invalide</h2>
        <p id="error-message"></p>
        <a href="/" class="btn-primary" style="display: inline-block; margin-top: 20px;">Retour à l'accueil</a>
      </div>
    </div>

    <div id="register-form-container" style="display: none;">
      <form id="register-form" class="form-container">
        <h2>Finaliser votre inscription</h2>

        <div class="form-group">
          <label for="nom" class="form-label">Nom *</label>
          <input type="text" id="nom" placeholder="Votre nom" required>
        </div>

        <div class="form-group">
          <label for="prenom" class="form-label">Prénom *</label>
          <input type="text" id="prenom" placeholder="Votre prénom" required>
        </div>

        <div class="form-group">
          <label for="username" class="form-label">Nom d'utilisateur *</label>
          <input type="text" id="username" placeholder="Choisissez un nom d'utilisateur (min. 3 caractères)" required minlength="3">
          <div id="username-feedback" class="username-feedback"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Mot de passe *</label>
          <input type="password" id="password" placeholder="Choisissez un mot de passe (min. 4 caractères)" required minlength="4">
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirmer le mot de passe *</label>
          <input type="password" id="confirm-password" placeholder="Retapez votre mot de passe" required>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">Créer mon compte</button>
      </form>
    </div>

    <div id="success-state" style="display: none;">
      <div class="success-container">
        <h2>Compte créé avec succès !</h2>
        <p>Votre compte a été créé. Vous pouvez maintenant vous connecter.</p>
        <a href="/" class="btn-primary" style="display: inline-block; margin-top: 20px;">Se connecter</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
