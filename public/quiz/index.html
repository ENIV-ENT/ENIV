<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - ENIV</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/css/loading.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-logo">Eniv</div>
        <div class="loading-spinner-bar"></div>
    </div>
    <header>
        <h1><a href="/dashboard" style="color: inherit; text-decoration: none; cursor: pointer;">Eniv</a></h1>
        <div class="header-actions">
            <div class="user-menu">
                <button id="user-menu-btn" class="user-menu-btn">
                    <span id="eleve-info"></span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 0.5rem;">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div id="user-dropdown" class="user-dropdown hidden">
                    <button id="emploi-temps-btn" class="dropdown-item hidden">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        Emploi du temps
                    </button>
                    <button id="settings-btn" class="dropdown-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        Paramètres
                    </button>
                    <button id="logout-btn" class="dropdown-item logout">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Déconnexion
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="header">
            <h1>🎓 Quiz</h1>
            <p id="quizTitle">Chargement...</p>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="correct">0</div>
                <div class="stat-label">Correctes</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="incorrect">0</div>
                <div class="stat-label">Incorrectes</div>
            </div>
        </div>

        <div class="mode-selector" id="modeSelector" style="display: none;">
            <h3 class="mode-title">Choisissez votre mode de quiz</h3>
            <div class="mode-buttons">
                <button class="mode-btn" onclick="startQuiz('choice')">📝 Choix multiples</button>
                <button class="mode-btn" onclick="startQuiz('oral')">🗣️ Mode oral</button>
            </div>
        </div>

        <div class="progress-bar" id="progressBar" style="display: none;">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="quiz-card" id="quizCard" style="display: none;">
            <div class="question-number" id="questionNumber"></div>
            <div class="question" id="question"></div>

            <div class="options" id="options" style="display: none;"></div>

            <div class="oral-response" id="oralResponse" style="display: none;">
                <button class="btn btn-primary" id="showAnswerBtn" onclick="showAnswer()">Voir la réponse</button>
                <div class="self-evaluation" id="selfEvaluation" style="display: none;">
                    <p>Avez-vous donné la bonne réponse ?</p>
                    <div class="eval-buttons">
                        <button class="btn btn-success" onclick="evaluateAnswer(true)">✓ Oui</button>
                        <button class="btn btn-danger" onclick="evaluateAnswer(false)">✗ Non</button>
                    </div>
                </div>
                <div class="correct-answer" id="correctAnswer" style="display: none;"></div>
            </div>

            <div class="explanation" id="explanation">
                <div class="explanation-title">💡 Explication</div>
                <div class="explanation-text" id="explanationText"></div>
                <div class="example" id="example">
                    <div class="example-title">📝 Exemple concret</div>
                    <div class="example-text" id="exampleText"></div>
                </div>
            </div>
            <div class="buttons">
                <button class="btn btn-secondary" onclick="previousQuestion()" id="prevBtn">Précédent</button>
                <button class="btn btn-primary" id="validateBtn" onclick="validateAnswer()" style="display: none;">Valider</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">Suivant</button>
            </div>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-title">🎉 Quiz Terminé !</div>
            <div class="result-score" id="finalScore"></div>
            <div class="result-message" id="resultMessage"></div>
            <button class="btn btn-primary" onclick="restartQuiz()">Recommencer</button>
            <button class="btn btn-secondary" onclick="goBack()">Retour au dashboard</button>
        </div>
    </div>

    <script src="quiz.js" type="module"></script>
</body>
</html>
