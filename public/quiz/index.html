<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Quiz - ENIV</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <meta name="theme-color" content="#4a90e2">
    <script src="/js/pwa.js" defer></script>
    <!-- Doit rester synchrone et avant les styles : applique le thème avant le premier rendu -->
    <script src="/js/theme-init.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/css/loading.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-logo">Eniv</div>
        <div class="loading-spinner-bar"></div>
    </div>
    <header>
        <h1><a href="/dashboard" style="color: inherit; text-decoration: none; cursor: pointer;">Eniv</a></h1>
        <div class="header-actions">
            <div class="user-menu">
                <button id="user-menu-btn" class="user-menu-btn">
                    <span id="eleve-info"></span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 0.5rem;">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div id="user-dropdown" class="user-dropdown hidden">
                    <button id="dashboard-btn" class="dropdown-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        Tableau de bord
                    </button>
                    <button id="settings-btn" class="dropdown-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        Paramètres
                    </button>
                    <button id="emploi-temps-btn" class="dropdown-item hidden">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        Emploi du temps
                    </button>
                    <button id="notes-btn" class="dropdown-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" viewBox="0 0 24 24" fill="none">
                            <path d="M16 1C17.6569 1 19 2.34315 19 4C19 4.55228 18.5523 5 18 5C17.4477 5 17 4.55228 17 4C17 3.44772 16.5523 3 16 3H4C3.44772 3 3 3.44772 3 4V20C3 20.5523 3.44772 21 4 21H16C16.5523 21 17 20.5523 17 20V19C17 18.4477 17.4477 18 18 18C18.5523 18 19 18.4477 19 19V20C19 21.6569 17.6569 23 16 23H4C2.34315 23 1 21.6569 1 20V4C1 2.34315 2.34315 1 4 1H16Z" fill="#0F0F0F"/>
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M20.7991 8.20087C20.4993 7.90104 20.0132 7.90104 19.7133 8.20087L11.9166 15.9977C11.7692 16.145 11.6715 16.3348 11.6373 16.5404L11.4728 17.5272L12.4596 17.3627C12.6652 17.3285 12.855 17.2308 13.0023 17.0835L20.7991 9.28666C21.099 8.98682 21.099 8.5007 20.7991 8.20087ZM18.2991 6.78666C19.38 5.70578 21.1325 5.70577 22.2134 6.78665C23.2942 7.86754 23.2942 9.61999 22.2134 10.7009L14.4166 18.4977C13.9744 18.9398 13.4052 19.2327 12.7884 19.3355L11.8016 19.5C10.448 19.7256 9.2744 18.5521 9.50001 17.1984L9.66448 16.2116C9.76728 15.5948 10.0602 15.0256 10.5023 14.5834L18.2991 6.78666Z" fill="#0F0F0F"/>
                            <path d="M5 7C5 6.44772 5.44772 6 6 6H14C14.5523 6 15 6.44772 15 7C15 7.55228 14.5523 8 14 8H6C5.44772 8 5 7.55228 5 7Z" fill="#0F0F0F"/>
                            <path d="M5 11C5 10.4477 5.44772 10 6 10H10C10.5523 10 11 10.4477 11 11C11 11.5523 10.5523 12 10 12H6C5.44772 12 5 11.5523 5 11Z" fill="#0F0F0F"/>
                            <path d="M5 15C5 14.4477 5.44772 14 6 14H7C7.55228 14 8 14.4477 8 15C8 15.5523 7.55228 16 7 16H6C5.44772 16 5 15.5523 5 15Z" fill="#0F0F0F"/>
                        </svg>
                        Notes
                    </button>
                    <button id="theme-toggle-btn" class="dropdown-item">
                        <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <span id="theme-text">Thème sombre</span>
                    </button>
                    <button id="logout-btn" class="dropdown-item logout">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Déconnexion
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="header">
            <h1>🎓 Quiz</h1>
            <p id="quizTitle">Chargement...</p>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="correct">0</div>
                <div class="stat-label">Correctes</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="incorrect">0</div>
                <div class="stat-label">Incorrectes</div>
            </div>
        </div>

        <div class="mode-selector" id="modeSelector" style="display: none;">
            <h3 class="mode-title">Choisissez votre mode de quiz</h3>
            <div class="mode-buttons">
                <button class="mode-btn" onclick="startQuiz('choice')">📝 Choix multiples</button>
                <button class="mode-btn" onclick="startQuiz('oral')">🗣️ Mode oral</button>
            </div>
        </div>

        <div class="progress-bar" id="progressBar" style="display: none;">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="quiz-card" id="quizCard" style="display: none;">
            <div class="question-number" id="questionNumber"></div>
            <div class="question" id="question"></div>

            <div class="options" id="options" style="display: none;"></div>

            <div class="oral-response" id="oralResponse" style="display: none;">
                <button class="btn btn-primary" id="showAnswerBtn" onclick="showAnswer()">Voir la réponse</button>
                <div class="self-evaluation" id="selfEvaluation" style="display: none;">
                    <p>Avez-vous donné la bonne réponse ?</p>
                    <div class="eval-buttons">
                        <button class="btn btn-success" onclick="evaluateAnswer(true)">✓ Oui</button>
                        <button class="btn btn-danger" onclick="evaluateAnswer(false)">✗ Non</button>
                    </div>
                </div>
                <div class="correct-answer" id="correctAnswer" style="display: none;"></div>
            </div>

            <div class="explanation" id="explanation">
                <div class="explanation-title">💡 Explication</div>
                <div class="explanation-text" id="explanationText"></div>
                <div class="example" id="example">
                    <div class="example-title">📝 Exemple concret</div>
                    <div class="example-text" id="exampleText"></div>
                </div>
            </div>
            <div class="buttons">
                <button class="btn btn-secondary" onclick="previousQuestion()" id="prevBtn">Précédent</button>
                <button class="btn btn-primary" id="validateBtn" onclick="validateAnswer()" style="display: none;">Valider</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">Suivant</button>
            </div>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-title">🎉 Quiz Terminé !</div>
            <div class="result-score" id="finalScore"></div>
            <div class="result-message" id="resultMessage"></div>
            <button class="btn btn-primary" onclick="restartQuiz()">Recommencer</button>
            <button class="btn btn-secondary" onclick="goBack()">Retour au dashboard</button>
        </div>
    </div>

    <script src="quiz.js" type="module"></script>
</body>
</html>
