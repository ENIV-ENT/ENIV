# Production on the VPS (the repository's compose.yaml stays the local test environment).
services:
  eniv:
    build: .
    image: eniv:local
    container_name: eniv
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    ports:
      # Caddy forwards /api, /ws and /vendor of app.eniv.fr to this port
      - "127.0.0.1:3650:3650"
    volumes:
      # files uploaded by users (Caddy serves /uploads straight from this folder)
      - ./data/uploads:/app/backend/uploads
    networks: [db]
    healthcheck:
      # public route that queries the database
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3650/api/registration/etablissements').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  db:
    external: true
