# Local test environment: MySQL + the app.
#   docker compose up            -> database + app on http://localhost:3000
#   docker compose up db         -> MySQL only (to run the app on the host)
#   phpMyAdmin starts with the whole stack on http://localhost:8080
#
# The values below are development defaults; a .env file at the root
# overrides them automatically (Compose interpolation).

services:
  db:
    image: mysql:8.4
    command:
      # The schema declares no charset: it inherits the server's.
      # utf8mb4 is required for accented characters (établissement, élève, ...).
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devpassword}
      MYSQL_DATABASE: ${DB_NAME:-ent}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # The app calls process.exit(1) when the connection fails: it must only
      # start once MySQL actually accepts queries.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    image: node:26-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm start"
    environment:
      NODE_ENV: development          # -> port 3000 (3650 otherwise, see server.js)
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ent}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      BASE_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-not-for-production}
      # External API keys: left empty, the matching features
      # (AI quizzes, emails) are disabled in tests.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      PREMIUM_API_KEY: ${PREMIUM_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # node_modules in a volume: keeps the host folder from
      # overwriting the install made inside the container.
      - app-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # Automatic root login: avoids typing the development credentials
      # every time the interface is opened.
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-devpassword}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  app-node-modules:
