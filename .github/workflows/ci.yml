name: CI

# Checks every pull request and every push to main.
# Deployment (deploy-vps.yml) only runs when this workflow passes on main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the now useless check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check the syntax of every JavaScript file
        run: git ls-files '*.js' | xargs -n 1 node --check

      - name: Unit tests
        run: npm test

      # Same as deploy.sh on the VPS: catches an import cycle or a crash on the
      # real files before going to production. Nothing is committed.
      - name: Version assets (as on deployment)
        run: node scripts/version-assets.js

  startup:
    name: Startup on MySQL (migrations + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        # Same version as production and compose.yaml; keep in sync by hand,
        # Dependabot only updates the Dockerfile
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: ent
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: ent
      DB_USER: root
      DB_PASSWORD: ci
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Start the app on an empty database
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: All migrations ran
        run: |
          # Migrations run in the background at startup: wait for them to finish
          for _ in $(seq 1 60); do grep -q "Migrations terminées" server.log && break; sleep 1; done
          grep -q "Migrations terminées" server.log

      - name: Smoke test
        run: node scripts/smoke-test.js http://127.0.0.1:3000

      - name: Restart on the existing database (idempotent migrations)
        run: |
          pid="$(cat server.pid)"
          kill "$pid"
          # Wait for the actual shutdown, otherwise the new server fails with EADDRINUSE
          for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then echo "The previous server does not stop"; exit 1; fi
          node server.js > server2.log 2>&1 &
          for _ in $(seq 1 30); do grep -q "Aucune migration en attente" server2.log && break; sleep 1; done
          grep -q "Aucune migration en attente" server2.log
          node scripts/smoke-test.js http://127.0.0.1:3000

      - name: No migration or initialization error
        # After the smoke tests, to also catch errors logged after the expected
        # messages; `if` because `! grep` does not trigger errexit.
        run: |
          if grep -e "Erreur lors de la migration" -e "Erreur lors de l'initialisation" server.log server2.log; then exit 1; fi

      - name: Server logs
        if: always()
        run: cat server.log server2.log 2>/dev/null || true

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: eniv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Informational: a vulnerability published in a dependency must not block
    # an urgent fix. The check shows up red but does not prevent the rest of
    # the CI from passing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: npm audit (production, high severity)
        run: npm audit --omit=dev --audit-level=high
