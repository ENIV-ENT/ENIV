name: Deployment

# Deploys main to the VPS, only when the CI is green on that commit.
# Can also be started by hand from the Actions tab (workflow_dispatch).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run also fires when the CI fails: only deploy a push to main
    # whose CI succeeded
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      # deploy.sh ships the head of main, not necessarily the commit checked here.
      # If main has moved on, skip: the CI of the next commit will deploy.
      - name: Check that main still points to the checked commit
        id: check
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$main" != "$SHA" ]; then
            echo "::notice::main moved to $main: deployment left to the CI of that commit"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run deploy.sh on the VPS
        if: steps.check.outputs.stale != 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted on the server: the only accepted command is the project name.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy@"$HOST" eniv

      - uses: actions/checkout@v7
        if: steps.check.outputs.stale != 'true' && vars.APP_URL != ''
        with:
          sparse-checkout: scripts

      - name: Smoke test on production
        if: steps.check.outputs.stale != 'true' && vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
          # Leaves time for the container to rebuild and restart
          SMOKE_TIMEOUT_S: 180
        run: node scripts/smoke-test.js "$APP_URL"
